# Parcel Atlas — Render background worker.
#
# Secrets are NEVER stored here. Every credential uses `sync: false`, which
# means Render prompts for the value once and stores it encrypted in the
# service's own environment. Nothing sensitive is committed to Git.
#
# The worker runs a single instance by design: one Gmail mailbox and a
# rate-limited Cotality sandbox cannot tolerate parallel consumers.
services:
  - type: worker
    name: parcel-atlas-worker
    runtime: node
    plan: starter
    region: oregon
    rootDir: frontend
    # No `next build`: the worker never serves HTTP, so a full app build would
    # only add deploy time and new failure modes.
    buildCommand: pnpm install --frozen-lockfile=false
    startCommand: pnpm exec tsx scripts/render-worker.ts
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.18.0
      - key: LOG_LEVEL
        value: info
      - key: PARCEL_ATLAS_BASE_URL
        value: https://australian-property.vercel.app
      - key: WORKER_POLL_INTERVAL_MS
        value: "60000"
      - key: WORKER_LEASE_SECONDS
        value: "900"
      - key: WORKER_MAX_EMAILS
        value: "5"
      # --- Secrets: set in the Render dashboard, never in this file ---
      - key: DATABASE_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: BROWSERLESS_WS_ENDPOINT
        sync: false
      - key: BROWSERLESS_API_KEY
        sync: false
      - key: GMAIL_USERNAME
        sync: false
      - key: GMAIL_PASSWORD
        sync: false
      - key: GMAIL_ALLOWED_SENDERS
        sync: false
      - key: CORELOGIC_CLIENT_ID
        sync: false
      - key: CORELOGIC_CLIENT_SECRET
        sync: false
      - key: CORELOGIC_SANDBOX_BASE_URL
        sync: false
