name: Gmail CSV report pipeline

on:
  schedule:
    # Avoid minute 0, when GitHub's scheduled-workflow queue is busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional operator note for this one-off run"
        required: false
        type: string

# One Gmail mailbox and one Cotality sandbox must never have concurrent workers.
concurrency:
  group: parcel-atlas-gmail-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-mailbox:
    name: Process one durable mailbox cycle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: production
      PARCEL_ATLAS_BASE_URL: https://australian-property.vercel.app
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.GMAIL_TOKEN_ENCRYPTION_KEY }}
      # Explicit operator choice: a valid CSV from any sender can create a job.
      GMAIL_ALLOW_ANY_SENDER: "true"
    steps:
      - name: Check out the pinned main revision
        uses: actions/checkout@v4
      # setup-node resolves the pnpm cache path during initialization, so pnpm
      # must be installed before caching is enabled.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Finite by design: it processes one job, or checks the inbox once, then exits.
      - name: Run one durable worker cycle
        run: pnpm worker:scheduled
